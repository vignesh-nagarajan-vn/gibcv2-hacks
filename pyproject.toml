[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage-engine"
version = "0.1.0"
description = "Offline backtest overfitting auditor. Reads CSVs from data/, writes JSON to results/."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["engine", "engine.scripts"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
addopts = "-q"
